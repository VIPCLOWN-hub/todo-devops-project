<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <p class="subtitle">
            DevOps Mini Project
        </p>


        <!-- Add Task Form -->

        <form action="/add" method="POST" class="task-form">

            <input
                type="text"
                name="title"
                placeholder="Enter a new task..."
                required
            >

            <button type="submit">
                Add Task
            </button>

        </form>


        <!-- Task List -->

        <div class="task-list">

            {% if tasks %}

                {% for task in tasks %}

                    <div class="task
                        {% if task['completed'] %}
                            completed
                        {% endif %}
                    ">

                        <div class="task-title">

                            {% if task['completed'] %}

                                <span>✓</span>

                            {% else %}

                                <span>○</span>

                            {% endif %}


                            <span>
                                {{ task['title'] }}
                            </span>

                        </div>


                        <div class="actions">

                            <a
                                href="{{ url_for(
                                    'complete_task',
                                    task_id=task['id']
                                ) }}"
                                class="complete-btn"
                            >
                                {% if task['completed'] %}
                                    Undo
                                {% else %}
                                    Complete
                                {% endif %}
                            </a>


                            <a
                                href="{{ url_for(
                                    'delete_task',
                                    task_id=task['id']
                                ) }}"
                                class="delete-btn"
                            >
                                Delete
                            </a>

                        </div>

                    </div>

                {% endfor %}

            {% else %}

                <div class="empty">
                    No tasks yet. Add your first task!
                </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
